# .gitlab-ci.yml
stages:
  - security

anvil_gatekeeper_audit:
  stage: security
  image: python:3.11-slim
  before_script:
    - pip install pyyaml
  script:
    - echo "Igniting ANVIL Gatekeeper Sentinel..."
    # Replace './tests/samples/vuln.py' with your actual application entrypoint
    - python main.py "python ./tests/samples/vuln.py" --mode gatekeeper
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - reports/
    reports:
      # Natively maps the SARIF output to GitLab's Security Dashboard
      sast: reports/anvil_report.sarif
  allow_failure: false # Setting to false means ANVIL's sys.exit(1) will strictly block the merge request